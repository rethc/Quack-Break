plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.quacktimer'
version = '0.1.0'

android {
  namespace "expo.modules.quacktimer"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Stop cancels expo-notifications' booked reminders by calling it by name at runtime
  // (see ExpoNotificationsBridge), so there's no compile-time dependency on it.
  implementation 'androidx.core:core:1.17.0'
}
