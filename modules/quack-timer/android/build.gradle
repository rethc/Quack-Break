plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.quacktimer'
version = '0.1.0'

android {
  namespace "expo.modules.quacktimer"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Stop cancels the reminders that expo-notifications has booked.
  implementation project(':expo-notifications')
  implementation 'androidx.core:core:1.17.0'
}
